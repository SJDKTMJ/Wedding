name: Shift hero photo slightly right

on:
  push:
    paths:
      - '.github/workflows/shift-hero-photo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shift only hero photo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "#hero .frame img{width:100%;height:100%;object-fit:cover}"
          new = "#hero .frame img{width:100%;height:100%;object-fit:cover;transform:translateX(5px) scale(1.02)}"
          if old not in s:
              raise SystemExit('Target hero image CSS not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "대표 사진을 살짝 오른쪽으로 정렬"
          git push
