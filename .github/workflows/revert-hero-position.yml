name: Restore original hero photo position

on:
  push:
    paths:
      - '.github/workflows/revert-hero-position.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore hero photo CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "#hero .frame img{width:100%;height:100%;object-fit:cover;transform:translateX(10px) scale(1.03)}"
          new = "#hero .frame img{width:100%;height:100%;object-fit:cover}"
          if old not in s:
              raise SystemExit('Target hero image CSS not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "대표 사진 위치를 원래대로 복구"
          git push
