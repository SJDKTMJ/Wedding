name: Fix Kakao Naver relay path

on:
  push:
    paths:
      - '.github/workflows/fix-kakao-naver-path.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "locationUrl=new URL('naver-map.html?name='+encodeURIComponent(D.wedding.hall||'르비르모어')+'&lat='+encodeURIComponent(D.wedding.lat)+'&lng='+encodeURIComponent(D.wedding.lng),url).href"
          new = "locationUrl=location.origin+'/Wedding/naver-map.html?name='+encodeURIComponent(D.wedding.hall||'르비르모어')+'&lat='+encodeURIComponent(D.wedding.lat)+'&lng='+encodeURIComponent(D.wedding.lng)"
          if old not in s:
              raise SystemExit('Target string not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "카카오톡 위치 안내 경로를 Wedding 하위로 고정"
          git push
