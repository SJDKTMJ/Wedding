name: Patch Naver Map share location

on:
  push:
    paths:
      - '.github/workflows/patch-naver-location.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "locationUrl=kakaoMapUrl()"
          new = "locationUrl=new URL('naver-map.html?name='+encodeURIComponent(D.wedding.hall||'르비르모어')+'&lat='+encodeURIComponent(D.wedding.lat)+'&lng='+encodeURIComponent(D.wedding.lng),url).href"
          if old not in text:
              raise SystemExit('Expected shareKakao locationUrl pattern was not found; refusing to modify index.html.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "카카오톡 위치 안내를 네이버지도 앱으로 연결"
          git push
