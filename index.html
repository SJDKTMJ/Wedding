<!DOCTYPE html>
<!-- 모바일 청첩장 · TOUCH TO MEET stable v1.0 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>청첩장</title>
<meta property="og:type" content="website">
<meta property="og:title" id="og-title" content="청첩장">
<meta property="og:description" id="og-desc" content="">
<meta property="og:image" id="og-image" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ─────────────────────────────────────────────
   토큰 — 관리자 화면에서 덮어씁니다
   ───────────────────────────────────────────── */
:root{
  --paper:#F7F7F4;
  --ink:#1B1E23;
  --accent:#2E4062;   /* 쪽빛 */
  --point:#9C3B36;    /* 연지 */
  --mist:#8792A6;
  --line:#E2E1DB;

  --serif:'Gowun Batang', serif;
  --sans:'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;

  --w:430px;
  --pad:26px;
  --thread:1px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:#EDEDE9; color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
img{display:block; max-width:100%}
[hidden]{display:none !important}
button{font:inherit; color:inherit; cursor:pointer}
a{color:inherit}

/* 페이지 = 폭 고정된 종이 한 장 */
#paper{
  max-width:var(--w); margin:0 auto; background:var(--paper);
  position:relative; overflow:hidden;
  box-shadow:0 0 40px rgba(0,0,0,.06);
}

.sec{position:relative; z-index:1; padding:64px var(--pad)}
.sec--flush{padding-left:0; padding-right:0}

/* 실을 끊는 섹션 표식 */
.mark{
  display:block; width:7px; height:7px; margin:0 auto 30px;
  background:var(--paper); border:1px solid var(--accent);
  transform:rotate(45deg);
}
.eyebrow{
  display:block; text-align:center; font-size:10px; letter-spacing:.34em;
  text-transform:uppercase; color:var(--mist); margin-bottom:10px;
}
.sec-title{
  font-family:var(--serif); font-size:20px; font-weight:400;
  text-align:center; letter-spacing:.06em; margin:0 0 34px;
}

/* ── 표지 ─────────────────────────────────── */
#hero{position:relative; z-index:2; background:var(--paper)}
#hero .frame{position:relative; overflow:hidden; aspect-ratio:4/5; background:#DEDCD6}
#hero .frame img{width:100%; height:100%; object-fit:cover}
#hero .frame::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(to bottom, rgba(0,0,0,.18) 0%, transparent 30%, transparent 55%, rgba(0,0,0,.42) 100%);
}
#hero .stamp{
  position:absolute; top:22px; left:0; right:0; text-align:center;
  color:#fff; font-size:10px; letter-spacing:.4em; text-transform:uppercase;
  opacity:.85; z-index:2;
}
/* 세로쓰기 이름 — 가운데 괘선을 사이에 두고 마주본다 */
.names{
  position:absolute; left:0; right:0; bottom:24px; z-index:3;
  display:flex; justify-content:center; align-items:flex-start;
}
.names .rule{width:1px; background:rgba(255,255,255,.55); margin:5px 24px 0; align-self:stretch}
.names .n{
  writing-mode:vertical-rl; text-orientation:upright;
  font-family:var(--serif); font-size:33px; line-height:1.24;
  letter-spacing:.14em; color:#fff; text-shadow:0 1px 16px rgba(0,0,0,.5);
}

.when{
  text-align:center; padding:36px var(--pad) 10px; position:relative; z-index:3;
}
.when .d{font-size:15px; letter-spacing:.3em; font-weight:500}
.when .t{font-size:12px; letter-spacing:.2em; color:var(--mist); margin-top:7px}
.when .p{font-family:var(--serif); font-size:15px; margin-top:14px; letter-spacing:.04em}

/* ── 인사말 ───────────────────────────────── */
.greet{font-family:var(--serif); text-align:center; line-height:2.25; font-size:15.5px; white-space:pre-line}
.greet-poem{
  font-family:var(--serif); text-align:center; color:var(--accent);
  font-size:14px; line-height:2.1; white-space:pre-line; margin-bottom:30px;
}

/* ── 혼주 ─────────────────────────────────── */
.parents{display:grid; gap:16px; max-width:320px; margin:0 auto}
.parents .row{
  display:grid; grid-template-columns:1fr auto; align-items:center;
  gap:10px; font-size:14.5px;
}
.parents .who{font-family:var(--serif); letter-spacing:.02em}
.parents .who b{font-weight:400}
.parents .who .sm{font-size:12px; color:var(--mist); margin-right:6px}
.callrow{display:flex; gap:6px}
.icobtn{
  width:34px; height:34px; border:1px solid var(--line); background:#fff;
  border-radius:50%; display:grid; place-items:center; color:var(--accent);
}
.icobtn svg{width:15px; height:15px}
.divider{height:1px; background:var(--line); margin:22px auto; max-width:60px}

/* ── 달력 ─────────────────────────────────── */
.cal{max-width:300px; margin:0 auto; text-align:center}
.cal .mon{font-family:var(--serif); font-size:17px; letter-spacing:.16em; margin-bottom:16px}
.cal table{width:100%; border-collapse:collapse}
.cal th{font-size:10.5px; letter-spacing:.16em; color:var(--mist); font-weight:400; padding-bottom:10px}
.cal th:first-child{color:var(--point)}
.cal td{font-size:13.5px; padding:6px 0; color:var(--ink)}
.cal td.sun{color:var(--point)}
.cal td.off{color:#C9C7C0}
.cal .day{display:grid; place-items:center; width:30px; height:30px; margin:0 auto; border-radius:50%}
.cal td.on .day{background:var(--point); color:#fff}
.dday{margin-top:24px; font-size:13.5px; letter-spacing:.02em}
.dday b{font-weight:600; color:var(--point)}
.count{display:flex; justify-content:center; gap:0; margin-top:18px}
.count div{padding:0 14px; border-right:1px solid var(--line)}
.count div:last-child{border-right:0}
.count .num{font-size:19px; letter-spacing:.02em; font-variant-numeric:tabular-nums}
.count .lab{font-size:9.5px; letter-spacing:.2em; color:var(--mist); text-transform:uppercase}

/* ── 갤러리 ───────────────────────────────── */
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:4px}
.grid button{padding:0; border:0; background:#DEDCD6; aspect-ratio:1; overflow:hidden}
.grid img{width:100%; height:100%; object-fit:cover; transition:transform .5s}
.grid button:active img{transform:scale(1.05)}
.more{display:block; margin:18px auto 0; background:none; border:0; font-size:12px; letter-spacing:.16em; color:var(--mist); text-transform:uppercase}

/* ── 오시는 길 ─────────────────────────────── */
.place{text-align:center; margin-bottom:20px}
.place .hall{font-family:var(--serif); font-size:17px}
.place .addr{font-size:13.5px; color:#5A5F68; margin-top:7px; line-height:1.6}
#map{height:220px; background:#E6E5DF; border:1px solid var(--line); position:relative}
#map .ph{position:absolute; inset:0; display:grid; place-items:center; text-align:center; font-size:12px; color:var(--mist); padding:20px; line-height:1.8}
.navbtns{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px}
.navbtns a,.navbtns button{
  border:1px solid var(--line); background:#fff; padding:11px 0; text-align:center;
  font-size:12px; letter-spacing:.04em; text-decoration:none; color:var(--ink);
}
.tps{margin-top:28px; display:grid; gap:20px}
.tp .k{font-size:12px; letter-spacing:.16em; color:var(--accent); margin-bottom:6px}
.tp .v{font-size:13.5px; color:#4C525C; white-space:pre-line; line-height:1.8}

/* ── 아코디언(계좌) ─────────────────────────── */
.acc{border-top:1px solid var(--line)}
.acc:last-of-type{border-bottom:1px solid var(--line)}
.acc>button{
  width:100%; background:none; border:0; padding:16px 4px; display:flex;
  justify-content:space-between; align-items:center; font-size:14px; letter-spacing:.04em;
}
.acc>button .chev{transition:transform .25s; color:var(--mist); font-size:11px}
.acc.open>button .chev{transform:rotate(180deg)}
.acc .body{display:none; padding:0 4px 18px}
.acc.open .body{display:block}
.bank{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0}
.bank+.bank{border-top:1px dashed var(--line)}
.bank .info{font-size:13px; line-height:1.65}
.bank .info .b{color:var(--mist); font-size:11.5px; letter-spacing:.1em}
.bank .info .num{font-variant-numeric:tabular-nums; letter-spacing:.02em}
.copy{border:1px solid var(--line); background:#fff; padding:7px 12px; font-size:11.5px; white-space:nowrap; letter-spacing:.06em}
.copy:active{background:var(--accent); color:#fff; border-color:var(--accent)}

/* ── 폼 ───────────────────────────────────── */
.field{margin-bottom:14px}
.field label{display:block; font-size:11.5px; letter-spacing:.14em; color:var(--mist); margin-bottom:7px}
.field input,.field textarea,.field select{
  width:100%; border:1px solid var(--line); background:#fff; padding:11px 12px;
  font:inherit; font-size:14px; border-radius:0; color:var(--ink);
}
.field textarea{min-height:96px; resize:vertical; line-height:1.7}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--accent); outline-offset:-1px}
.seg{display:grid; grid-auto-flow:column; gap:6px}
.seg button{border:1px solid var(--line); background:#fff; padding:11px 0; font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:var(--accent)}
.btn{
  width:100%; border:1px solid var(--accent); background:var(--accent); color:#fff;
  padding:14px 0; font-size:14px; letter-spacing:.1em;
}
.btn.ghost{background:#fff; color:var(--accent)}
.btn:active{opacity:.85}

/* ── 방명록 ───────────────────────────────── */
.gb{display:grid; gap:0; margin-top:8px}
.gb .item{padding:16px 2px; border-bottom:1px solid var(--line)}
.gb .item:first-child{border-top:1px solid var(--line)}
.gb .head{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.gb .nm{font-family:var(--serif); font-size:14.5px}
.gb .dt{font-size:11px; color:var(--mist); font-variant-numeric:tabular-nums}
.gb .msg{font-size:14px; margin-top:7px; white-space:pre-line; line-height:1.8; color:#3E434B}
.gb .del{background:none; border:0; font-size:11px; color:var(--mist); padding:4px 0; margin-top:4px}
.empty{text-align:center; color:var(--mist); font-size:13px; padding:34px 0}
.pager{display:flex; justify-content:center; gap:14px; margin-top:18px; font-size:12px; color:var(--mist)}
.pager button{background:none; border:0; color:var(--accent)}
.pager button:disabled{color:#CDCBC4}

/* ── 공유 / 하단 ───────────────────────────── */
.share{display:grid; grid-template-columns:1fr 1fr; gap:8px; max-width:300px; margin:0 auto}
.share button{border:1px solid var(--line); background:#fff; padding:13px 0; font-size:12.5px; letter-spacing:.06em}
.foot{text-align:center; padding:44px var(--pad) calc(90px + env(safe-area-inset-bottom)); position:relative; z-index:1}
.foot .sig{font-family:var(--serif); font-size:14px; letter-spacing:.1em; color:var(--accent)}
.foot .cr{font-size:10.5px; color:var(--mist); margin-top:12px; letter-spacing:.06em}

.dock{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:var(--w); background:rgba(247,247,244,.94);
  backdrop-filter:blur(10px); border-top:1px solid var(--line);
  display:grid; grid-template-columns:repeat(3,1fr); z-index:40;
  padding-bottom:env(safe-area-inset-bottom);
}
.dock button{background:none; border:0; padding:13px 0; font-size:11.5px; letter-spacing:.08em; color:var(--ink)}
.dock button+button{border-left:1px solid var(--line)}

/* ── BGM ──────────────────────────────────── */
#bgm{
  position:fixed; top:14px; right:calc(50% - var(--w)/2 + 14px); z-index:45;
  width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,.5);
  background:rgba(0,0,0,.22); color:#fff; display:grid; place-items:center; font-size:13px;
}
@media (max-width:460px){ #bgm{right:14px} }

/* ── 라이트박스 / 모달 ─────────────────────── */
.ov{position:fixed; inset:0; background:rgba(20,21,24,.94); z-index:60; display:none}
.ov.on{display:block}
.ov .x{position:absolute; top:calc(12px + env(safe-area-inset-top)); right:14px; background:none; border:0; color:#fff; font-size:24px; line-height:1; padding:8px; z-index:2}
.ov .stage{position:absolute; inset:0; display:grid; place-items:center; padding:52px 12px}
.ov .stage img{max-width:100%; max-height:100%; object-fit:contain}
.ov .cnt{position:absolute; bottom:calc(20px + env(safe-area-inset-bottom)); left:0; right:0; text-align:center; color:rgba(255,255,255,.7); font-size:12px; letter-spacing:.16em}
.ov .arw{position:absolute; top:50%; transform:translateY(-50%); background:none; border:0; color:#fff; font-size:26px; padding:18px}
.ov .arw.l{left:0} .ov .arw.r{right:0}

.sheet{position:fixed; inset:0; z-index:70; display:none}
.sheet.on{display:block}
.sheet .bg{position:absolute; inset:0; background:rgba(20,21,24,.5)}
.sheet .panel{
  position:absolute; left:50%; bottom:0; transform:translateX(-50%);
  width:100%; max-width:var(--w); background:var(--paper);
  padding:26px var(--pad) calc(26px + env(safe-area-inset-bottom));
  max-height:88vh; overflow:auto;
}
.sheet h3{font-family:var(--serif); font-size:17px; font-weight:400; margin:0 0 4px; text-align:center}
.sheet .sub{text-align:center; font-size:12.5px; color:var(--mist); margin-bottom:22px; white-space:pre-line}

.toast{
  position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(8px);
  background:var(--ink); color:#fff; padding:11px 18px; font-size:12.5px; letter-spacing:.04em;
  z-index:90; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

/* ── 등장 모션 ─────────────────────────────── */
.rise{opacity:0; transform:translateY(16px); transition:opacity .9s ease, transform .9s ease}
.rise.in{opacity:1; transform:none}
@media (prefers-reduced-motion:reduce){
  .rise{opacity:1; transform:none; transition:none}
  *{animation-duration:.001ms !important}
}

/* ── 관리자 ───────────────────────────────── */
#admin{display:none; max-width:760px; margin:0 auto; background:#fff; min-height:100vh}
body.admin #admin{display:block}
body.admin #paper,body.admin .dock,body.admin #bgm{display:none}
.ah{position:sticky; top:0; background:#fff; border-bottom:1px solid var(--line); padding:14px 20px; display:flex; justify-content:space-between; align-items:center; z-index:10}
.ah .ttl{font-size:14px; letter-spacing:.1em}
.ah .acts{display:flex; gap:8px}
.ah button{border:1px solid var(--line); background:#fff; padding:8px 14px; font-size:12.5px}
.ah button.pri{background:var(--accent); color:#fff; border-color:var(--accent)}
.tabs{display:flex; gap:0; border-bottom:1px solid var(--line); overflow-x:auto; background:#fff; position:sticky; top:57px; z-index:9}
.tabs button{border:0; background:none; padding:12px 15px; font-size:12.5px; white-space:nowrap; color:var(--mist); border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.apane{display:none; padding:22px 20px 80px}
.apane.on{display:block}
.apane h4{font-size:12px; letter-spacing:.16em; color:var(--mist); margin:26px 0 12px; text-transform:uppercase}
.apane h4:first-child{margin-top:0}
.two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.arow{display:flex; gap:8px; align-items:flex-end; margin-bottom:10px}
.arow .field{flex:1; margin-bottom:0}
.mini{border:1px solid var(--line); background:#fff; padding:9px 12px; font-size:12px}
.mini.dan{color:var(--point)}
.listcard{border:1px solid var(--line); padding:14px; margin-bottom:10px}
.hint{font-size:12px; color:var(--mist); line-height:1.7; margin:8px 0 0}
.thumbs{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px}
.thumbs .t{position:relative; aspect-ratio:1; background:#EEE; overflow:hidden; border:1px solid var(--line)}
.thumbs .t img{width:100%; height:100%; object-fit:cover}
.thumbs .t button{position:absolute; top:3px; right:3px; width:20px; height:20px; border:0; background:rgba(0,0,0,.6); color:#fff; font-size:12px; line-height:1; border-radius:50%}
.swatch{display:flex; align-items:center; gap:8px}
.swatch input[type=color]{width:38px; height:34px; padding:0; border:1px solid var(--line); background:#fff}
table.adm{width:100%; border-collapse:collapse; font-size:12.5px}
table.adm th,table.adm td{border-bottom:1px solid var(--line); padding:9px 6px; text-align:left}
table.adm th{color:var(--mist); font-weight:400; font-size:11px; letter-spacing:.1em}
.gate{max-width:320px; margin:22vh auto; padding:0 20px; text-align:center}
.gate .k{font-family:var(--serif); font-size:18px; margin-bottom:6px}
.gate .s{font-size:12.5px; color:var(--mist); margin-bottom:22px}

/* ═══════════════════════════════════════════════════════════
   EDITORIAL MOTION · TWO TO ONE · TOUCH INTRO
   첫 진입은 0% 상태에서 멈춘다. TOUCH TO MEET을 터치하면
   25% → 50% → 75% → 100% 스토리보드 순서로 자동 진행하고,
   100% 완료 뒤에만 본문 스크롤을 해제한다.
   ═══════════════════════════════════════════════════════════ */
:root{
  --editorial-cream:#E8D0B7; --editorial-navy:#19304B; --editorial-rust:#A65F35;
  --editorial-charcoal:#1C2430; --editorial-serif:'Cormorant Garamond','Nanum Myeongjo',serif;
  --ease-editorial:cubic-bezier(.22,.61,.36,1);
}
body{background:#E8E5DF}
#paper{box-shadow:0 18px 70px rgba(26,36,48,.08)}
#hero{height:auto;padding:0;background:linear-gradient(180deg,#F7F2E9 0%,var(--paper) 100%);overflow:visible;position:relative}
.hero-sticky{position:relative;top:0;height:100svh;min-height:680px;padding:0 18px 104px;overflow:hidden;background:linear-gradient(180deg,#F7F2E9 0%,var(--paper) 100%)}
.hero-topline{height:74px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;position:relative;z-index:8;font-family:var(--editorial-serif);font-size:10px;letter-spacing:.24em;color:var(--editorial-navy);opacity:var(--topOpacity,0);transform:translateY(var(--topY,-8px));will-change:opacity,transform}
#hero-vol{user-select:none;-webkit-tap-highlight-color:transparent}.hero-topline-center{font-size:9px;letter-spacing:.32em;opacity:.62;white-space:nowrap}.hero-menu{justify-self:end;padding:8px 0 8px 10px;border:0;background:none;font-family:var(--editorial-serif);font-size:10px;letter-spacing:.24em;color:var(--editorial-navy)}
.hero-motion{position:relative;height:min(68svh,610px);min-height:520px;overflow:hidden;background:#E3DED6;isolation:isolate}
.hero-photo-mask{position:absolute;inset:0;z-index:1;overflow:hidden;clip-path:inset(0 var(--photoInset,46.5%) 0 var(--photoInset,46.5%));will-change:clip-path}
.hero-photo-mask img{width:100%;height:100%;object-fit:cover;object-position:center;transform:scale(var(--photoScale,1.055));will-change:transform}
.hero-photo-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,23,37,.09),rgba(11,23,37,.02) 42%,rgba(11,23,37,.42))}
.split-panel{position:absolute;top:0;bottom:0;width:var(--panelWidth,50.2%);z-index:4;overflow:hidden;opacity:var(--panelOpacity,1);will-change:width,opacity}
.split-panel--groom{left:0;background:var(--editorial-cream);color:var(--editorial-rust)}.split-panel--bride{right:0;background:var(--editorial-navy);color:rgba(231,235,239,.83)}
.split-initial{position:absolute;top:25px;font-family:var(--editorial-serif);font-size:18px;opacity:var(--splitTextOpacity,1)}.split-panel--groom .split-initial{left:24px}.split-panel--bride .split-initial{right:24px}
.split-name{position:absolute;top:50%;font-family:var(--editorial-serif);font-size:35px;letter-spacing:.08em;line-height:1;writing-mode:vertical-rl;text-orientation:mixed;transform:translateY(-50%);opacity:var(--splitTextOpacity,1)}.split-panel--groom .split-name{left:40px}.split-panel--bride .split-name{right:40px}

<script>
/* ═══════════════════════════════════════════════════════════
   TOUCH TO MEET · EARLY INTRO ENGINE
   - Supabase/CDN 초기화와 무관하게 DOM이 만들어지자마자 바인딩
   - 최초 진입: APART 상태에서 정지
   - TOUCH/CLICK/ENTER/SPACE: APPROACH → MEET → MERGE → ONE
   - 완료 전 스크롤 잠금, 완료 후 즉시 해제
   ═══════════════════════════════════════════════════════════ */
(function(){
  'use strict';

  var state = 'waiting';
  var raf = 0;
  var bound = false;
  var startedAt = 0;
  var motion = document.getElementById('hero-motion');
  var hero = document.getElementById('hero');
  var dock = document.getElementById('dock');

  var KEYS = [
    { t: 0,    p: 0.00 },
    { t: 620,  p: 0.25 },
    { t: 1260, p: 0.50 },
    { t: 1960, p: 0.75 },
    { t: 2820, p: 1.00 }
  ];

  function clamp(n){ return Math.max(0, Math.min(1, n)); }
  function seg(p,a,b){ return clamp((p-a)/(b-a)); }
  function smooth(t){ return t*t*(3-2*t); }

  function announce(next){
    state = next;
    try {
      window.dispatchEvent(new CustomEvent('weddingintrostate', { detail:{ state:next } }));
    } catch(_) {}
  }

  function lockPage(){
    document.documentElement.style.overflow = 'hidden';
    document.documentElement.style.height = '100%';
    document.body.classList.add('intro-pending');
    document.body.classList.remove('intro-playing','intro-complete');
    document.body.style.overflow = 'hidden';
    document.body.style.height = '100%';
    document.body.style.touchAction = 'none';
    try { window.scrollTo(0,0); } catch(_) {}
  }

  function unlockPage(){
    document.documentElement.style.overflow = '';
    document.documentElement.style.height = '';
    document.body.style.overflow = '';
    document.body.style.height = '';
    document.body.style.touchAction = '';
    document.body.classList.remove('intro-pending','intro-playing');
    document.body.classList.add('intro-complete');
  }

  function apply(p){
    if(!hero) return;
    p = clamp(p);

    var top    = smooth(seg(p,.00,.08));
    var groom  = smooth(seg(p,.06,.25));
    var bride  = smooth(seg(p,.14,.33));
    var photo  = smooth(seg(p,.20,.72));
    var panel  = smooth(seg(p,.20,.76));
    var lines  = smooth(seg(p,.52,.69));
    var meta   = smooth(seg(p,.67,.83));
    var when   = smooth(seg(p,.78,.96));
    var dockP  = smooth(seg(p,.84,.98));
    var cueOut = smooth(seg(p,.03,.20));

    hero.style.setProperty('--topOpacity', top.toFixed(3));
    hero.style.setProperty('--topY', (-8*(1-top)).toFixed(2)+'px');
    hero.style.setProperty('--groomClip', (100*(1-groom)).toFixed(2)+'%');
    hero.style.setProperty('--brideClip', (100*(1-bride)).toFixed(2)+'%');
    hero.style.setProperty('--groomTrack', (.13+.42*(1-groom)).toFixed(3)+'em');
    hero.style.setProperty('--brideTrack', (.13+.42*(1-bride)).toFixed(3)+'em');
    hero.style.setProperty('--photoInset', (46.5*(1-photo)).toFixed(2)+'%');
    hero.style.setProperty('--photoScale', (1+.055*(1-photo)).toFixed(4));
    hero.style.setProperty('--panelWidth', (50.2*(1-panel)).toFixed(2)+'%');
    hero.style.setProperty('--panelOpacity', (1-smooth(seg(p,.62,.78))).toFixed(3));
    hero.style.setProperty('--splitTextOpacity', (1-smooth(seg(p,.48,.69))).toFixed(3));
    hero.style.setProperty('--andOpacity', lines.toFixed(3));
    hero.style.setProperty('--andScale', lines.toFixed(3));
    hero.style.setProperty('--metaOpacity', meta.toFixed(3));
    hero.style.setProperty('--metaY', (8*(1-meta)).toFixed(2)+'px');
    hero.style.setProperty('--whenOpacity', when.toFixed(3));
    hero.style.setProperty('--whenY', (12*(1-when)).toFixed(2)+'px');
    hero.style.setProperty('--startCueOpacity', (1-cueOut).toFixed(3));
    hero.style.setProperty('--startCueY', (-5*cueOut).toFixed(2)+'px');

    if(dock){
      dock.style.opacity = dockP.toFixed(3);
      dock.style.transform = 'translate(-50%,'+(100*(1-dockP)).toFixed(2)+'%)';
      dock.style.pointerEvents = (state==='complete' && dockP>.85) ? 'auto' : 'none';
    }
  }

  function timeline(ms){
    if(ms<=KEYS[0].t) return KEYS[0].p;
    for(var i=1;i<KEYS.length;i++){
      var a=KEYS[i-1], b=KEYS[i];
      if(ms<=b.t){
        var local=smooth(clamp((ms-a.t)/(b.t-a.t)));
        return a.p+(b.p-a.p)*local;
      }
    }
    return 1;
  }

  function complete(skipAnimation){
    if(raf){ cancelAnimationFrame(raf); raf=0; }
    announce('complete');
    apply(1);
    unlockPage();
    if(motion){
      motion.removeAttribute('role');
      motion.removeAttribute('tabindex');
      motion.removeAttribute('aria-label');
      motion.style.pointerEvents='';
    }
    if(dock) dock.style.pointerEvents='auto';
  }

  function frame(now){
    if(state!=='playing') return;
    var elapsed=now-startedAt;
    apply(timeline(elapsed));
    if(elapsed<KEYS[KEYS.length-1].t){
      raf=requestAnimationFrame(frame);
    }else{
      raf=0;
      complete(false);
    }
  }

  function start(ev){
    if(ev && ev.type==='pointerup' && ev.pointerType==='mouse' && ev.button!==0) return;
    if(state!=='waiting' || document.body.classList.contains('admin')) return;
    announce('playing');
    document.body.classList.remove('intro-pending');
    document.body.classList.add('intro-playing');
    document.body.style.touchAction='none';
    if(motion) motion.style.pointerEvents='none';

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){ complete(true); return; }

    startedAt=performance.now();
    raf=requestAnimationFrame(frame);
  }

  function keydown(e){
    if(e.key==='Enter' || e.key===' '){
      e.preventDefault();
      start(e);
    }
  }

  function bind(){
    if(bound || !motion) return;
    bound=true;
    motion.addEventListener('pointerup', start, {passive:true});
    motion.addEventListener('click', start, {passive:true});
    motion.addEventListener('touchend', start, {passive:true});
    motion.addEventListener('keydown', keydown);
  }

  function reset(){
    if(raf){ cancelAnimationFrame(raf); raf=0; }
    announce('waiting');
    if(motion){
      motion.setAttribute('role','button');
      motion.setAttribute('tabindex','0');
      motion.setAttribute('aria-label','터치하여 청첩장 열기');
      motion.style.pointerEvents='';
    }
    lockPage();
    apply(0);
  }

  window.WeddingIntro = {
    get state(){ return state; },
    start:start,
    bind:bind,
    reset:reset,
    apply:apply,
    complete:complete,
    duration:KEYS[KEYS.length-1].t
  };

  /* 관리자 진입은 인트로를 건너뛴다. 일반 진입은 즉시 잠그고 대기. */
  if(location.hash==='#admin'){
    announce('complete');
    apply(1);
    unlockPage();
  }else{
    bind();
    reset();
  }
})();
</script>

let sb = null;
let connError = '';

function initSupabase() {
  if (!window.supabase || !window.supabase.createClient) {
    connError = 'Supabase 라이브러리를 불러오지 못했습니다. 네트워크를 확인해 주세요.';
    return false;
  }
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    return true;
  } catch (e) {
    connError = '연결 설정에 실패했습니다: ' + e.message;
    return false;
  }
}

    const path = `${kind}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const up = await sb.storage.from(BUCKET).upload(path, blob, { contentType: 'image/jpeg', upsert: false });

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (t, cls, html) => { const n = document.createElement(t); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

const rememberEmail = (v) => { try { localStorage.setItem('wedding:email', v); } catch { } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function merge(base, over) {
  if (Array.isArray(base)) return Array.isArray(over) ? over : base;
  if (base && typeof base === 'object') {
    const out = { ...base };
    for (const k in (over || {})) out[k] = merge(base[k] === undefined ? over[k] : base[k], over[k]);
    return out;
  }
  return over === undefined ? base : over;
}

const WEEK_KO = ['일', '월', '화', '수', '목', '금', '토'];

function weddingAt(w) {
  const [y, m, d] = (w.date || '2026-01-01').split('-').map(Number);
  const [hh, mm] = (w.time || '12:00').split(':').map(Number);
  return new Date(y, m - 1, d, hh || 0, mm || 0);
}
function timeKo(t) {
  const [h, m] = (t || '12:00').split(':').map(Number);
  const ap = h < 12 ? '오전' : '오후';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${ap} ${h12}시` + (m ? ` ${m}분` : '');
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2400);
}
async function copy(text, msg = '복사했습니다') {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = el('textarea'); ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch { }
    ta.remove();
  }
  toast(msg);
}
/** 업로드 전에 줄여서 용량과 로딩 속도를 아낀다 */
function resizeToBlob(file, maxW = 1600, q = 0.82) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const c = el('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => b ? res(b) : rej(new Error('변환 실패')), 'image/jpeg', q);
      };
      img.onerror = () => rej(new Error('이미지를 읽을 수 없습니다'));
      img.src = fr.result;
    };
    fr.onerror = () => rej(new Error('파일을 읽을 수 없습니다'));
    fr.readAsDataURL(file);
  });
}

  'data:image/svg+xml;utf8,' + encodeURIComponent(

/** Supabase 오류를 사람이 읽을 수 있는 말로 */
function humanize(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/Invalid login credentials/i.test(m)) return '이메일 또는 비밀번호가 맞지 않습니다.';
  if (/Email not confirmed/i.test(m)) return '이메일 인증이 안 된 계정입니다. Supabase에서 Auto Confirm으로 다시 만들어 주세요.';
  if (/row-level security|violates row-level/i.test(m)) return '권한이 없습니다. 관리자로 로그인했는지 확인해 주세요.';
  if (/Failed to fetch|NetworkError/i.test(m)) return '서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.';
  if (/JWT|apikey|Invalid API key/i.test(m)) return '접속 키가 올바르지 않습니다.';
  return m;
}

function renderCalendar() {
  const w = D.wedding, dt = weddingAt(w);
  const y = dt.getFullYear(), m = dt.getMonth(), day = dt.getDate();
  const first = new Date(y, m, 1).getDay();
  const last = new Date(y, m + 1, 0).getDate();

  let cells = Array(first).fill(null).concat([...Array(last)].map((_, i) => i + 1));
  while (cells.length % 7) cells.push(null);

  let rows = '';
  for (let i = 0; i < cells.length; i += 7) {
    rows += '<tr>' + cells.slice(i, i + 7).map((d, j) => {
      if (!d) return '<td class="off"></td>';
      const cls = [j === 0 ? 'sun' : '', d === day ? 'on' : ''].filter(Boolean).join(' ');
      return `<td class="${cls}"><span class="day">${d}</span></td>`;
    }).join('') + '</tr>';
  }
  $('#cal').innerHTML =
    `<div class="mon">${y}. ${String(m + 1).padStart(2, '0')}</div>
     <table><thead><tr>${WEEK_KO.map(d => `<th>${d}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;

  const g = D.couple.groom.first, b = D.couple.bride.first;
  const tick = () => {
    const diff = dt - new Date();
    if (diff <= 0) {
      $('#dday').innerHTML = `<b>${esc(g)}</b> 님과 <b>${esc(b)}</b> 님이 결혼하였습니다.`;
      $('#count').innerHTML = ''; clearInterval(countdownTimer); return;
    }
    const s = Math.floor(diff / 1000);
    const parts = [['days', Math.floor(s / 86400)], ['hours', Math.floor(s / 3600) % 24],
                   ['min', Math.floor(s / 60) % 60], ['sec', s % 60]];
    $('#dday').innerHTML = `${esc(g)} <span style="color:var(--point)">♥</span> ${esc(b)}의 결혼식이 <b>${parts[0][1]}일</b> 남았습니다.`;
    $('#count').innerHTML = parts.map(([l, v]) =>
      `<div><div class="num">${String(v).padStart(2, '0')}</div><div class="lab">${l}</div></div>`).join('');
  };
  clearInterval(countdownTimer); tick(); countdownTimer = setInterval(tick, 1000);
}

/** 버튼을 잠그고 작업 → 중복 제출 방지 */
async function busy(btn, label, fn) {
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = label;
  try { await fn(); }
  catch (e) { toast(humanize(e)); }
  finally { btn.disabled = false; btn.textContent = old; }
}

/* ── 스크롤 등장 ──────────────────────────── */
function observeRise() {
  const io = new IntersectionObserver((es) => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }), { threshold: 0.12 });
  $$('.rise').forEach(n => io.observe(n));
}

/* ── 갤러리 미세 패럴랙스 / 하단 메뉴 상태 ───────────── */
let galleryRAF = 0;
function updateGalleryParallax() {
  galleryRAF = 0;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const vh = window.innerHeight || 800;
  $$('#grid [data-drift]').forEach(tile => {
    const r = tile.getBoundingClientRect();
    if (r.bottom < -100 || r.top > vh + 100) return;
    const progress = Math.max(-1, Math.min(1, ((r.top + r.height/2) - vh/2) / (vh/2)));
    const y = Math.round(progress * 20 * (Number(tile.dataset.drift)||1));
    const img = $('img', tile); if (img) img.style.setProperty('--parallax', `${y}px`);
  });
}
function requestGalleryParallax(){ if(!galleryRAF) galleryRAF=requestAnimationFrame(updateGalleryParallax); }
const clamp01 = n => Math.max(0, Math.min(1, n));
const segment = (p, a, b) => clamp01((p - a) / (b - a));
const smooth = t => t * t * (3 - 2 * t);
let openingState = (window.WeddingIntro && window.WeddingIntro.state) || 'waiting';
window.addEventListener('weddingintrostate', e => { openingState = e.detail && e.detail.state ? e.detail.state : openingState; });

/* 인트로는 Supabase보다 먼저 생성된 독립 엔진에 위임한다. */
function applyOpeningProgress(p) {
  if (window.WeddingIntro) window.WeddingIntro.apply(p);
}
function startTouchOpening() {
  if (window.WeddingIntro) window.WeddingIntro.start();
}
function setupTouchOpening() {
  if (!window.WeddingIntro) return;
  window.WeddingIntro.bind();
  openingState = window.WeddingIntro.state;
  if (location.hash !== '#admin' && openingState === 'waiting') window.WeddingIntro.apply(0);
}
function cancelTouchOpeningForAdmin() {
  if (!window.WeddingIntro) return;
  window.WeddingIntro.complete(true);
  openingState = 'complete';
}

function observeDockSections(){
  if(!('IntersectionObserver' in window)) return;
  const bs=$$('#dock [data-go]'); const byId=new Map(bs.map(b=>[b.dataset.go,b]));
  const io=new IntersectionObserver(es=>{const a=es.filter(e=>e.isIntersecting).sort((x,y)=>y.intersectionRatio-x.intersectionRatio)[0];if(!a)return;bs.forEach(b=>b.classList.toggle('active',b===byId.get(a.target.id)));},{rootMargin:'-34% 0px -52% 0px',threshold:[0,.2,.55]});
  bs.forEach(b=>{const s=$('#'+b.dataset.go);if(s)io.observe(s)});
}

/* ── 전역 이벤트 ──────────────────────────── */
function bindEvents() {
  $('#grid').onclick = e => { const b = e.target.closest('[data-i]'); if (b) openLb(+b.dataset.i); };
  $('#grid-more').onclick = () => { galleryOpen = !galleryOpen; renderGallery(); };
  $('#lb-x').onclick = () => { $('#lb').classList.remove('on'); document.body.style.overflow = ''; };
  $('#lb-p').onclick = () => stepLb(-1);
  $('#lb-n').onclick = () => stepLb(1);
  $('#gb-open').onclick = openGuestbookForm;
  $('#rsvp-open').onclick = openRsvpForm;
  $('#sh-kakao').onclick = shareKakao;
  $('#sh-link').onclick = shareLink;
  const goSection = b => { const s = b && $('#' + b.dataset.go); if (s) s.scrollIntoView({behavior:'smooth',block:'start'}); };
  $('#dock').onclick = e => goSection(e.target.closest('[data-go]'));
  $('#hero').onclick = e => { const b=e.target.closest('[data-go]'); if(b) goSection(b); };
  window.addEventListener('scroll', requestGalleryParallax, {passive:true});
  window.addEventListener('resize', requestGalleryParallax, {passive:true});
  setupTouchOpening();
  observeDockSections();
  document.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeSheet(); $('#lb').classList.remove('on'); document.body.style.overflow = ''; }
    if ($('#lb').classList.contains('on')) { if (e.key === 'ArrowLeft') stepLb(-1); if (e.key === 'ArrowRight') stepLb(1); }
  });
  let sx = 0;
  $('#lb').addEventListener('touchstart', e => sx = e.touches[0].clientX, { passive: true });
  $('#lb').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 50) stepLb(dx > 0 ? -1 : 1);
  }, { passive: true });
}

const TABS = [['basic', '기본'], ['words', '인사말·혼주'], ['photo', '사진'], ['place', '오시는 길'], ['money', '계좌'], ['inbox', '받은 정보'], ['setup', '설정']];

function renderAdmin() {
  const a = $('#admin');

  if (!signedIn) {
    a.innerHTML = `<div class="gate">
      <div class="k">관리자</div>
      <div class="s">Supabase에 등록한 계정으로 로그인하세요</div>
      <div class="field"><input id="g-mail" type="email" autocomplete="username" placeholder="이메일" value="${esc(lastEmail())}"></div>
      <div class="field"><input id="g-pw" type="password" autocomplete="current-password" placeholder="비밀번호"></div>
      <button class="btn" id="g-go">로그인</button>
      <p class="hint" style="margin-top:18px"><a href="#">청첩장으로 돌아가기</a></p></div>`;
    $('#g-go').onclick = (e) => busy(e.currentTarget, '확인 중…', async () => {
      const mail = $('#g-mail').value.trim();
      await DB.signIn(mail, $('#g-pw').value);
      rememberEmail(mail);
      signedIn = true;
      try { RS = await DB.listRsvp(); } catch { RS = []; }
      renderAdmin();
    });
    $('#g-pw').onkeydown = e => { if (e.key === 'Enter') $('#g-go').click(); };
    (lastEmail() ? $('#g-pw') : $('#g-mail')).focus();
    return;
  }

  a.innerHTML = `
    <div class="ah">
      <div class="ttl">청첩장 관리 <span style="color:var(--mist);font-size:11px">Editorial Motion v1.0</span>
        ${dirty ? '<span style="color:var(--point)"> • 저장 안 됨</span>' : ''}</div>
      <div class="acts">
        <button id="prev">미리보기</button>
        <button class="pri" id="sv">저장</button>
      </div>
    </div>
    <div class="tabs">${TABS.map(([k, n]) => `<button data-tab="${k}" aria-selected="${tab === k}">${n}</button>`).join('')}</div>
    <div class="apane on">${PANES[tab]()}</div>`;

  $$('.tabs button').forEach(b => b.onclick = () => { collect(); tab = b.dataset.tab; renderAdmin(); });
  $('#prev').onclick = (e) => busy(e.currentTarget, '저장 중…', async () => {
    collect(); await DB.putContent(D); dirty = false; location.hash = '';
  });
  $('#sv').onclick = (e) => busy(e.currentTarget, '저장 중…', async () => {
    collect(); await DB.putContent(D); dirty = false;
    renderAll(); renderAdmin(); toast('저장했습니다');
  });
  $$('#admin [data-bind]').forEach(i => i.oninput = () => {
    dirty = true;
    if (i.dataset.mirror) $$(`#admin [data-mirror="${i.dataset.mirror}"]`).forEach(o => { if (o !== i) o.value = i.value; });
  });
  bindPane();
}

/** 화면의 모든 입력을 D에 반영 */
function collect() {
  $$('#admin [data-bind]').forEach(i => {
    const p = i.dataset.bind;
    let v = i.type === 'checkbox' ? i.checked : i.value;
    if (i.dataset.type === 'num') v = parseFloat(v) || 0;
    setP(D, p, v);
  });
}

async function reloadPhotos() {
  PHOTOS = await DB.listPhotos();
  HERO = PHOTOS.find(p => p.kind === 'hero') || null;
  GALLERY = PHOTOS.filter(p => p.kind === 'gallery');
}

function bindPane() {
  if (tab === 'photo') {
    const pick = $('#pick');
    let target = 'gallery';

    $('#hero-file').onclick = () => { target = 'hero'; pick.multiple = false; pick.click(); };
    $('#gal-file').onclick = () => { target = 'gallery'; pick.multiple = true; pick.click(); };

    $('#hero-url').onclick = async () => {
      const u = prompt('이미지 주소를 붙여넣으세요 (https://...)'); if (!u) return;
      try {
        if (HERO) await DB.delPhoto(HERO);
        await DB.addPhotoUrl('hero', u.trim(), 0);
        await reloadPhotos(); renderAll(); renderAdmin(); toast('대표 사진을 바꿨습니다');
      } catch (e) { toast(humanize(e)); }
    };
    $('#gal-url').onclick = async () => {
      const u = prompt('이미지 주소를 붙여넣으세요 (https://...)'); if (!u) return;
      try {
        await DB.addPhotoUrl('gallery', u.trim(), GALLERY.length);
        await reloadPhotos(); renderAll(); renderAdmin(); toast('추가했습니다');
      } catch (e) { toast(humanize(e)); }
    };

    pick.onchange = async () => {
      const files = [...pick.files]; pick.value = '';
      if (!files.length) return;
      try {
        for (let i = 0; i < files.length; i++) {
          toast(`올리는 중 ${i + 1} / ${files.length}`);
          const blob = await resizeToBlob(files[i]);
          if (target === 'hero') {
            if (HERO) await DB.delPhoto(HERO);
            await DB.addPhoto('hero', blob, 0);
            await reloadPhotos();
          } else {
            await DB.addPhoto('gallery', blob, GALLERY.length + i);
          }
        }
        await reloadPhotos(); renderAll(); renderAdmin(); toast('사진을 올렸습니다');
      } catch (e) { toast(humanize(e)); }
    };

    const hd = $('[data-hero-del]');
    if (hd) hd.onclick = async () => {
      try { await DB.delPhoto(HERO); await reloadPhotos(); renderAll(); renderAdmin(); }
      catch (e) { toast(humanize(e)); }
    };
    $$('[data-gal-del]').forEach(b => b.onclick = async () => {
      const row = GALLERY.find(p => String(p.id) === b.dataset.galDel);
      try { await DB.delPhoto(row); await reloadPhotos(); renderAll(); renderAdmin(); }
      catch (e) { toast(humanize(e)); }
    });
  }

  if (tab === 'place') {
    $('#tp-add').onclick = () => { collect(); D.transport.push({ k: '', v: '' }); dirty = true; renderAdmin(); };
    $$('[data-tp-del]').forEach(b => b.onclick = () => { collect(); D.transport.splice(+b.dataset.tpDel, 1); dirty = true; renderAdmin(); });
  }

  if (tab === 'money') {
    $$('[data-ac-add]').forEach(b => b.onclick = () => {
      collect(); D.accounts[b.dataset.acAdd].push({ role: '', bank: '', num: '', holder: '', kakaopay: '' });
      dirty = true; renderAdmin();
    });
    $$('[data-ac-del]').forEach(b => b.onclick = () => {
      const [k, i] = b.dataset.acDel.split(':');
      collect(); D.accounts[k].splice(+i, 1); dirty = true; renderAdmin();
    });
  }

  if (tab === 'inbox') {
    $('#rs-reload').onclick = (e) => busy(e.currentTarget, '불러오는 중…', async () => {
      RS = await DB.listRsvp(); GB = await DB.listGuestbook(); renderAdmin();
    });
    $$('[data-rs-del]').forEach(b => b.onclick = async () => {
      try { await DB.delRsvp(b.dataset.rsDel); RS = await DB.listRsvp(); renderAdmin(); }
      catch (e) { toast(humanize(e)); }
    });
    $$('[data-gb-del]').forEach(b => b.onclick = async () => {
      try {
        await DB.adminDelGuestbook(b.dataset.gbDel);
        GB = await DB.listGuestbook(); renderGuestbook(); renderAdmin();
      } catch (e) { toast(humanize(e)); }
    });
    $('#csv').onclick = () => {
      const rows = [['구분', '성함', '참석', '인원', '식사', '연락처', '접수일시']]
        .concat(RS.map(r => [r.side || '', r.name, r.attending ? '참석' : '불참', r.headcount || 1, r.meal || '', r.phone || '', r.created_at]));
      const csv = '\uFEFF' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
      download(new Blob([csv], { type: 'text/csv' }), '참석여부.csv');
    };
  }

  if (tab === 'setup') {
    $('#exp').onclick = () => {
      collect();
      download(new Blob([JSON.stringify({ content: D, photos: PHOTOS, savedAt: new Date().toISOString() }, null, 2)],
        { type: 'application/json' }), 'wedding-backup.json');
    };
    $('#out').onclick = async () => {
      if (dirty && !confirm('저장하지 않은 변경이 있습니다. 그래도 나갈까요?')) return;
      await DB.signOut(); signedIn = false; dirty = false; renderAdmin();
    };
  }
}

function download(blob, name) {
  const u = URL.createObjectURL(blob), a = el('a');
  a.href = u; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 1000);
}

/* ═══ 라우팅 & 부팅 ════════════════════════════════════════ */
async function route() {
  const admin = location.hash === '#admin';
  document.body.classList.toggle('admin', admin);
  if (admin) cancelTouchOpeningForAdmin();
  if (!admin) {
    document.body.style.overflow = '';
    renderAll();
    /* #admin에서 돌아온 경우 이미 열린 청첩장 상태를 유지한다. */
    if (openingState === 'complete') applyOpeningProgress(1);
    return;
  }

  const s = await DB.session();
  signedIn = !!s;
  if (signedIn && !RS.length) { try { RS = await DB.listRsvp(); } catch { } }
  renderAdmin();
}

function fatal(msg) {
  document.body.innerHTML =
    `<div style="max-width:420px;margin:22vh auto;padding:0 24px;text-align:center;font-family:system-ui;color:#1B1E23">
       <div style="font-size:17px;margin-bottom:10px">청첩장을 불러오지 못했습니다</div>
       <div style="font-size:13.5px;color:#8792A6;line-height:1.8">${esc(msg)}</div>
       <button onclick="location.reload()" style="margin-top:22px;padding:11px 22px;border:1px solid #E2E1DB;background:#fff;font-size:13px">다시 시도</button>
     </div>`;
}

(async function boot() {
  /* TOUCH TO MEET은 DB/CDN 성공 여부와 무관하게 이미 바인딩되어 있다. */
  setupTouchOpening();
  if (!initSupabase()) return fatal(connError);
  try {
    await loadPublic();
  } catch (e) {
    return fatal(humanize(e) + '\n\nSupabase 프로젝트가 일시정지 상태일 수 있습니다.');
  }
  renderAll();
  bindEvents();
  observeRise();
  window.addEventListener('hashchange', route);
  await route();
  window.addEventListener('beforeunload', e => {
    if (dirty && location.hash === '#admin') { e.preventDefault(); e.returnValue = ''; }
  });
})();
